name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project and locate Android root
        run: |
          ls -la
          mkdir -p _unzipped
          for z in *.zip *.ZIP; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o "$z" -d _unzipped
            fi
          done
          GRADLEW_PATH=$(find _unzipped -name "gradlew" -type f | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/. .
          else
            echo "No gradlew found inside zip. Listing _unzipped:"
            find _unzipped -maxdepth 4
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karigar-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

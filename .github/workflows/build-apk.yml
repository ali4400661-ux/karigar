name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project and locate Android root
        run: |
          mkdir -p _unzipped
          for z in *.zip *.ZIP; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o "$z" -d _unzipped
            fi
          done
          SETTINGS_PATH=$(find _unzipped \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -type f | head -n 1)
          if [ -n "$SETTINGS_PATH" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            echo "Found Android project root at: $PROJECT_DIR"
            cp -rn "$PROJECT_DIR"/. .
          else
            echo "No settings.gradle(.kts) found inside zip."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle & generate wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karigar-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
